# Apache virtual host for the standalone server.
#
# The document root is public/ and every path that is not a real file is
# handed to the front controller, exactly like the Nginx try_files example in
# docs/installation.md. Actor routes such as /@alice and
# /.well-known/webfinger therefore reach PHP as well.

ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    # AT Protocol subscribeRepos is a long-lived WebSocket served by the
    # dedicated process, while all other XRPC requests stay in the PHP host.
    ProxyPassMatch "^/xrpc/com.atproto.sync.subscribeRepos$" "ws://firehose:2584/xrpc/com.atproto.sync.subscribeRepos" timeout=3600

    # Runtime state, the environment file and the SQLite database live outside
    # the document root; deny any accidental dotfile request as a second line
    # of defence. `/.well-known/` is the WebFinger and nodeinfo surface and
    # must stay reachable for federation.
    <DirectoryMatch "^/var/www/html/public/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    # Preserve the client scheme when TLS terminates in front of this
    # container. The host derives secure-cookie defaults from the configured
    # instance URL, not from this header, so it is informational only.
    SetEnvIf X-Forwarded-Proto https HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
