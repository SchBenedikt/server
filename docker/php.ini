; Aloha Social runtime defaults.
;
; Uploads are capped at 5 MiB by the application, so PHP must accept a little
; more than that. Keep these values in sync with docs/configuration.md.

upload_max_filesize = 6M
post_max_size = 8M
max_execution_time = 60
memory_limit = 256M

expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; Apache logs to stderr/stdout so `docker compose logs` shows them.
log_errors = On
error_log = /dev/stderr
