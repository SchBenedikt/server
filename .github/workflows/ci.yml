name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: composer validate --strict

      # The Core dist archive intentionally omits ui/; the shared Vue source
      # needs a source checkout for the frontend build (see issue #3).
      - run: composer install --no-interaction --no-progress --prefer-source

      - name: PHP lint
        run: find src bin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: License and attribution
        run: php bin/check-licenses.php

      - name: Backend tests and federation smoke
        run: composer check
        env:
          # Hosted runners normally have no globally routable address; the
          # guard correctly refuses loopback delivery. A self-hosted runner or
          # ALOHASOCIAL_SMOKE_HOST runs the full round trip instead.
          ALOHASOCIAL_SMOKE_ALLOW_SKIP: '1'

      - name: Frontend build
        run: |
          npm ci --prefix ui
          npm run build --prefix ui

      - name: Committed UI bundle is current
        run: git diff --exit-code -- public/ui
