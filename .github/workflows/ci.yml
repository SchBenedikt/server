name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      s3mock:
        image: adobe/s3mock:5.1.0
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: aloha-media-ci
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget --spider -q http://localhost:9090/favicon.ico"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alohasocial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alohasocial_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, intl, mbstring, pcntl, pdo_pgsql, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: composer validate --strict

      # The UI build uses the committed ui/shared-ui package, so a normal
      # Composer dist install is enough even though Core omits ui/.
      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP lint
        run: find src bin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: License and attribution
        run: php bin/check-licenses.php

      - name: Backend tests and federation smoke
        run: composer check
        env:
          # Hosted runners normally have no globally routable address; the
          # guard correctly refuses loopback delivery. A self-hosted runner or
          # ALOHASOCIAL_SMOKE_HOST runs the full round trip instead.
          ALOHASOCIAL_SMOKE_ALLOW_SKIP: '1'
          ALOHASOCIAL_S3_TEST_ENDPOINT: http://127.0.0.1:9090
          ALOHASOCIAL_S3_TEST_BUCKET: aloha-media-ci
          ALOHASOCIAL_S3_TEST_ACCESS_KEY: test-access-key
          ALOHASOCIAL_S3_TEST_SECRET_KEY: test-secret-key

      - name: PostgreSQL concurrency
        run: vendor/bin/phpunit tests/PostgresPasswordResetTest.php tests/PostgresRateLimitTest.php
        env:
          ALOHASOCIAL_TEST_PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=alohasocial_test
          ALOHASOCIAL_TEST_PG_USER: postgres
          ALOHASOCIAL_TEST_PG_PASSWORD: postgres

      - name: Install previous release and upgrade its database
        run: bash tools/upgrade-smoke.sh 0.12.0

      - name: Frontend build
        run: |
          npm ci --prefix ui
          npm run build --prefix ui

      - name: Committed UI bundle is current
        run: git diff --exit-code -- public/ui
