# Aloha Social — single-command installation.
#
#   cp .env.example .env    # optional but recommended
#   docker compose up -d --build
#
# The default is SQLite inside the `aloha-var` volume, so the stack starts with
# no external database. Set the ALOHASOCIAL_* values in `.env` to change the
# public URL, mail or discovery instance. For PostgreSQL use:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# The first admin account is created automatically when
# ALOHASOCIAL_ADMIN_HANDLE and ALOHASOCIAL_ADMIN_PASSWORD are set in `.env`.
#
# The default image is the one published to GitHub Container Registry on every
# push to main. `docker compose pull` fetches it; `docker compose build` builds
# the same tag from this checkout instead.

name: ${COMPOSE_PROJECT_NAME:-aloha-social}

# Web setup writes this file. It lives in the persistent `var` volume, so a
# configured domain survives `docker compose up -d`, image updates and
# container recreation. Values in the host `.env` still work; real process
# environment variables keep the highest precedence.
x-app-environment: &app-environment
  ALOHASOCIAL_ENV_FILE: ${ALOHASOCIAL_ENV_FILE:-/var/www/html/var/.env}

x-app-service: &app-service
  image: ghcr.io/schbenedikt/server:${ALOHASOCIAL_IMAGE_TAG:-latest}
  env_file:
    - path: .env
      required: false
  environment:
    <<: *app-environment
  volumes:
    - aloha-var:/var/www/html/var
  restart: unless-stopped

services:
  app:
    <<: *app-service
    build:
      context: .
    ports:
      - "${ALOHASOCIAL_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/healthz') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    <<: *app-service
    command: ["php", "bin/worker.php"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  firehose:
    <<: *app-service
    command: ["php", "bin/pds-firehose.php"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 2584) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

# Keep the physical volume name stable even when Compose is invoked with a
# different project name or from a renamed checkout. The explicit name is the
# one this stack has always used because the project is named `aloha-social`.
# Changing it would make an existing installation look empty. Independent
# installations on one host must set both COMPOSE_PROJECT_NAME and
# ALOHASOCIAL_VAR_VOLUME (and ALOHASOCIAL_DB_VOLUME for PostgreSQL); see
# docs/docker.md.
volumes:
  aloha-var:
    name: ${ALOHASOCIAL_VAR_VOLUME:-aloha-social_aloha-var}
